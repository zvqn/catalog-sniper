name: Sniper Auto Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# Shares a lock with the description workflow so the two never push at the same time.
concurrency:
  group: sniper-data
  cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update catalog data
        run: DATA_DIR=public/v1 node main.js

      - name: Normalize descriptions and rebuild search indexes
        run: node scripts/build-search-index.js

      - name: Update API info
        run: |
          jq -n \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --argjson emotes "$(jq .totalItems public/v1/emotedata.json)" \
            --argjson animations "$(jq .totalItems public/v1/animationdata.json)" \
            --argjson moods "$(jq .totalItems public/v1/mooddata.json)" \
            '{
              version: "1.0.0",
              lastUpdate: $date,
              emotes:     { count: $emotes,     path: "/v1/emotedata.json" },
              animations: { count: $animations, path: "/v1/animationdata.json" },
              moods:      { count: $moods,      path: "/v1/mooddata.json" }
            }' > public/v1/info.json

      - name: Commit and push changes
        run: |
          git add public/v1 generated/search-indexes

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update catalog data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: Log results
        run: |
          for file in emotedata animationdata mooddata; do
            echo "--- $file.json ---"
            jq -r '"Total items: \(.totalItems)\nLast update: \(.lastUpdate)"' "public/v1/$file.json"
          done
          echo "--- info.json ---"
          cat public/v1/info.json
